apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
    {{- with include "odoo.version" . }}
    app.kubernetes.io/version: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.odoo.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: odoo
  template:
    metadata:
      {{- $labels := include "odoo.podLabels" . }}
      labels:
        {{- $labels | nindent 8 }}
        {{- with include "odoo.extraMetadata" (list .Values.podLabels $labels) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- $annotations := printf "checksum/config: %s" (include "odoo.conf" . | sha256sum) }}
      annotations:
        {{- $annotations | nindent 8 }}
        {{- with include "odoo.extraMetadata" (list .Values.podAnnotations $annotations) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "odoo.podCommon" . | nindent 6 }}
      initContainers:
        {{- /*
        Waits until the database is ready for this image: click-odoo-update records the
        checksums of the modules at the end of its first pass (migrate Job). A first
        installation or an ephemeral instance runs the migrate Job after Helm has applied the release
        (post-install, post-upgrade), while this pod waits. After an update, the marker
        exists: no wait.
        */}}
        - name: wait-db
          {{- include "odoo.imageFields" . | nindent 10 }}
          command: [sh, -c]
          args:
            - >-
              until psql -tAc "select 1 from ir_config_parameter
              where key = 'module_auto_update.installed_checksums'" 2>/dev/null | grep -q 1;
              do echo "waiting for the database $PGDATABASE (migrate Job)"; sleep 5; done
          env:
            {{- include "odoo.env" . | nindent 12 }}
            - {name: HOME, value: /tmp}
          resources:
            {{- toYaml .Values.odoo.waitDb.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: odoo
          {{- include "odoo.imageFields" . | nindent 10 }}
          env:
            {{- include "odoo.env" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8069}
            {{- if gt (include "odoo.workers" . | int) 0 }}
            - {name: websocket, containerPort: 8072}
            {{- end }}
          startupProbe:
            httpGet: {path: /web/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          # TCP: a threaded Odoo (workers 0) answers no HTTP request while it installs a
          # module from the interface; only a process no longer listening is restarted
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /web/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
        {{- if .Values.mailpit.enabled }}
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: mailpit, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: mailpit}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          securityContext:
            {{- include "odoo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        {{- include "odoo.volumes" . | nindent 8 }}
