{{- /*
Secrets of an ephemeral instance, generated once and kept across upgrades (lookup): the
PostgreSQL password, the master password and the demo admin password.
*/ -}}
{{- if include "odoo.ephemeral" . }}
{{- $name := include "odoo.generatedSecret" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "pg-password" "admin-passwd" "review-admin-password" }}
  {{ $key }}: {{ index $existing $key | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
{{- end }}
