# Test values: persistent staging instance on an external CNPG database, Mailpit.
environment: staging

odoo:
  modules: [sale_management]
  config:
    options:
      workers: 2
      max_cron_threads: 1
  persistence:
    size: 5Gi
  # OpenTelemetry of a server-wide module: the header references the token of secrets.env
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway.observability.svc:4318
    OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20$(OTLP_TOKEN)

secrets:
  existingSecret: odoo-app
  env:
    - {name: OTLP_TOKEN, secret: otlp, key: token, optional: true}

database:
  external:
    # Stable Service odoo-db and the Secret of the declared role odoo
    host: odoo-db
    port: 5432
    secret: odoo-db-credentials

restorePoints:
  # deletionPolicy: Delete
  volumeSnapshotClass: csi-snapclass

mailpit:
  enabled: true

route:
  parentRefs:
    - {name: gateway, namespace: gateway-system}
  host: staging.example.com
  mailpitHost: mail.staging.example.com

networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
