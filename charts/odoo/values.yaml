# Values of the Odoo chart. See README.md.

# Name of the environment (review, staging, production...), set as a label on every
# resource; free, a DNS label
environment: ""

# Disposable instance (review app): the chart creates its own PostgreSQL and Secrets, the
# database and the filestore start empty (with demo data) on every new image, and there
# are no restore points. false: persistent instance on an external CloudNativePG cluster.
ephemeral: false

# Neutralize the database (odoo neutralize: no outgoing mail, no scheduled actions, no
# calls to external services) before the modules are updated, Odoo stopped, then give
# admin the password admin-user-password and, with Mailpit, send mail to it. Only for the
# update that follows a copy of production data into this instance, set on the command
# line (--set neutralize=true), never in a values file.
neutralize: false

# Project name: prefix of the review hosts (<project>-<release>.<route.reviewDomain>)
project: odoo

# Prefix of the labels and annotations of the chart (environment, image digest, restore
# points): a domain of the chart's owner. Changing it on a running environment hides its
# existing restore points from the chart.
labelPrefix: odoo.haroldd.dev

image:
  repository: ghcr.io/owner/repo/builds
  # Tag of the image, e.g. 1.0.0. Set the tag, the digest or both.
  tag: ""
  # sha256:<64 hex>, recommended: it takes precedence over the tag, so what runs is what
  # was tested, and restore points record that exact image.
  digest: ""
  # Always, IfNotPresent or Never; empty: Kubernetes default (IfNotPresent, except for the
  # tag latest). Always if a tag is pushed again.
  pullPolicy: ""
  # Names of existing docker-registry Secrets (GHCR)
  pullSecrets: []

# Labels and annotations added to the Odoo pods (team, cost center, monitoring...). The
# chart's own keys keep the chart's value. With an image tag, the pods also carry the
# standard label app.kubernetes.io/version.
podLabels: {}
podAnnotations: {}

# User of the Odoo containers, which must match the user of the image (default: uid and
# gid of the user odoo of the official odoo image). fsGroup makes the volumes writable by
# that group. null omits a field: for a platform that assigns the uid itself (OpenShift),
# or an image whose USER is numeric.
podSecurityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101

odoo:
  # Odoo instances. More than one needs a shared filestore: persistence.accessMode
  # ReadWriteMany, or no PVC with the filestore on S3.
  replicas: 1
  # Modules installed by the migrate Job (odoo -i). Empty: base only.
  modules: []
  # odoo.conf, section by section. The chart imposes data_dir (/var/lib/odoo, the volume)
  # and http_interface (and the SMTP of Mailpit when it is enabled). No secret here: the
  # schema refuses option names containing passw, secret or token.
  config:
    options:
      # Addons directories of the image (default: those of the official odoo image)
      addons_path: [/mnt/extra-addons]
      proxy_mode: true
      list_db: false
      workers: 2
      max_cron_threads: 1
      limit_memory_soft: 2147483648
      limit_memory_hard: 2684354560
      limit_time_cpu: 600
      limit_time_real: 1200
  # Filestore and sessions (/var/lib/odoo):
  #   1. one instance: enabled, ReadWriteOnce (default)
  #   2. several instances: enabled, ReadWriteMany (RWX storage class)
  #   3. several instances: disabled, filestore on S3 (fs_attachment-like module) and
  #      sessions in the database or Redis; /var/lib/odoo is then an emptyDir
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: ""
    size: 5Gi
    # Existing PVC instead of the one of the chart (manual restoration of the filestore
    # from the snapshot of a restore point)
    existingClaim: ""
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 3Gi}
  # Init container wait-db: waits until click-odoo-update has recorded the checksums of
  # the modules (end of the first migrate Job)
  waitDb:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

jobs:
  migrate:
    activeDeadlineSeconds: 1800

secrets:
  # Application Secret (keys admin-passwd, admin-user-password for the first deployment
  # and neutralize, optional smtp-password). Required unless ephemeral; an ephemeral
  # instance gets a Secret generated by the chart.
  existingSecret: ""
  # Secrets of the modules, as environment variables: [{name, secret, key}]
  env: []

database:
  # Name of Odoo's database, created by odoo db init (migrate Job)
  name: odoo
  ephemeral:
    image: postgres:18
    storageClass: ""
    size: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  external:
    # Stable Service in front of the primary of the active CNPG cluster, in the namespace
    # of the release (selector cnpg.io/cluster and cnpg.io/instanceRole: primary). The
    # restore points read the active cluster in its selector.
    host: ""
    port: 5432
    # Secret with the keys username and password (odoo-db-credentials with CNPG). The
    # role needs CREATEDB: Odoo creates its database at the first deployment.
    secret: ""

# Restore points of the updates (persistent instances): cold CNPG Backup of
# the database and VolumeSnapshot of the filestore, owned by the Backup
restorePoints:
  # Restore points kept among the validated and restored ones (at least 1)
  keep: 3
  # VolumeSnapshotClass of the filestore snapshot (deletionPolicy: Delete), required with
  # a PVC; the database snapshot uses the class of the CNPG Cluster
  volumeSnapshotClass: ""
  # Delay for the Backup and the filestore snapshot to be ready
  timeoutSeconds: 900
  # Image of the stop-snapshot and validate Jobs: sh and kubectl. Chainguard only
  # publishes latest and latest-dev for free: the digest is checked at every version of
  # the chart, and the value can point to a copy in the project registry.
  image: cgr.dev/chainguard/kubectl:latest-dev@sha256:63e7072e580dad3a8b9740e76594bb19156f81173f525d6b3765db58eb629704
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

mailpit:
  enabled: false
  image: axllent/mailpit:v1.31.4
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

route:
  # Gateway API parentRefs of the administrator's Gateway; no HTTPRoute when empty
  parentRefs: []
  # Odoo host (persistent instance)
  host: ""
  # Mailpit host (persistent instance with Mailpit)
  mailpitHost: ""
  # Hosts of an ephemeral instance: <project>-<release>.<reviewDomain> and <project>-<release>-mail.<reviewDomain>
  reviewDomain: ""

networkPolicy:
  enabled: true
  # NetworkPolicyPeers allowed to reach Odoo and Mailpit (the Gateway). Empty: any source.
  # An external database is protected by its own policy (README.md, Database).
  ingressFrom: []
